name: SimplePenNote
options:
  bundleIdPrefix: com.blueCode
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  defaultConfig: Release
  developmentLanguage: ko
  knownRegions:
    - ko
    - en
    - ja
    - zh-Hans

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.3.0"
    CURRENT_PROJECT_VERSION: 15
    SWIFT_STRICT_CONCURRENCY: targeted
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  SimplePenNote:
    type: application
    platform: iOS
    sources:
      - path: SimplePenNote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blueCode.SimplePenNote
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Distribution
        CODE_SIGN_ENTITLEMENTS: SimplePenNote/SimplePenNote.entitlements
        PROVISIONING_PROFILE_SPECIFIER: com.blueCode.SimplePenNote AppStore C599C444
        DEVELOPMENT_TEAM: KUDC7C6Z9H
    scheme:
      storeKitConfiguration: SimplePenNote/Resources/SimplePenNote.storekit
      testTargets:
        - SimplePenNoteTests
        - SimplePenNoteUITests
    info:
      path: SimplePenNote/Resources/Info.plist
      properties:
        CFBundleName: SimplePenNote
        CFBundleDisplayName: SimplePenNote
        CFBundleShortVersionString: "1.3.0"
        CFBundleVersion: "15"
        CFBundleIconName: AppIcon
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        NSFaceIDUsageDescription: "앱 잠금을 활성화하면 Face ID로 잠금을 해제합니다. SimplePenNote는 인증 결과만 사용하며, 생체 정보 자체에 접근하지 않습니다."

  SimplePenNoteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SimplePenNoteTests
    dependencies:
      - target: SimplePenNote
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.blueCode.SimplePenNote.tests

  SimplePenNoteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SimplePenNoteUITests
    dependencies:
      - target: SimplePenNote
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.blueCode.SimplePenNote.uitests
